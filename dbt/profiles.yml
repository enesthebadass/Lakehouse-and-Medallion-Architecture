lakehouse_medallion:
  target: local
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('DBT_TRINO_HOST', 'trino') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('DBT_TRINO_USER', 'dbt-local') }}"
      database: "{{ env_var('DBT_TRINO_CATALOG', 'lakehouse') }}"
      schema: "{{ env_var('DBT_TRINO_SCHEMA', 'gold_dbt') }}"
      http_scheme: http
      threads: 4
      retries: 3
