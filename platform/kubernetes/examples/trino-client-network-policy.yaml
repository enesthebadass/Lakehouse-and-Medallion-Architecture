apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-trino-clients
  namespace: lakehouse-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trino
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              platform.bank/trino-client: approved
      ports:
        - {protocol: TCP, port: 8443}
