apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: lakehouse-serving
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: coordinator
    platform.bank/owner: data-platform
    platform.bank/environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: coordinator
        platform.bank/owner: data-platform
        platform.bank/environment: production
    spec:
      serviceAccountName: trino
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trino
          image: registry.bank.internal/lakehouse/trino@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443, protocol: TCP}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "4", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          env:
            - name: RANGER_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-ranger-credentials
                  key: truststore-password
          readinessProbe:
            httpGet: {path: /v1/info, port: https, scheme: HTTPS}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /v1/info, port: https, scheme: HTTPS}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/trino, readOnly: true}
            - {name: runtime, mountPath: /data/trino}
            - {name: tmp, mountPath: /tmp}
            - {name: ranger-truststore, mountPath: /etc/trino/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: trino-coordinator-config}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: ranger-truststore
          secret: {secretName: trino-ranger-truststore}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trino
              app.kubernetes.io/component: coordinator
