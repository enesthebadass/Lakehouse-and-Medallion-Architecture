global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-poc
    platform: lakehouse-medallion

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: lakehouse-pipeline
    scrape_interval: 30s
    static_configs:
      - targets: [pipeline-metrics-exporter:9108]

  - job_name: trino
    metrics_path: /metrics
    basic_auth:
      username: monitoring
      password: ""
    static_configs:
      - targets: [trino:8080]
