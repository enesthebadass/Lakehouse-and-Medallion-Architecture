name: lakehouse-medallion-demo

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: lakehouse-medallion-demo-airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: lakehouse_medallion_demo_secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: us-east-1
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: lakehouse
    SPARK_MASTER_URL: spark://spark-master:7077
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - lakehouse
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    spark-master:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakehouse

  core-banking-source:
    image: postgres:15-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: ${CORE_BANKING_DB_USER:-core_banking}
      POSTGRES_PASSWORD: ${CORE_BANKING_DB_PASSWORD:-core_banking_local}
      POSTGRES_DB: ${CORE_BANKING_DB_NAME:-core_banking}
      CDC_DB_USER: ${CDC_DB_USER:-debezium}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-debezium_local}
    ports:
      - "${CORE_BANKING_DB_PORT:-5433}:5432"
    volumes:
      - core-banking-db-volume:/var/lib/postgresql/data
      - ./source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lakehouse

  core-banking-workload:
    build:
      context: ./source/workload
      dockerfile: Dockerfile
    image: lakehouse-medallion-demo-core-banking-workload:1.0
    environment:
      SOURCE_DB_HOST: core-banking-source
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_USER: ${CORE_BANKING_DB_USER:-core_banking}
      SOURCE_DB_PASSWORD: ${CORE_BANKING_DB_PASSWORD:-core_banking_local}
      SOURCE_DB_NAME: ${CORE_BANKING_DB_NAME:-core_banking}
      WORKLOAD_SEED: ${WORKLOAD_SEED:-42}
      WORKLOAD_BASE_DATE: ${WORKLOAD_BASE_DATE:-2026-01-15}
    depends_on:
      core-banking-source:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"
    networks:
      - lakehouse

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - lakehouse

  debezium-connect:
    image: quay.io/debezium/connect:3.2@sha256:bb7a4e3e44afe245fbb5b84b2acb3d8f29cceb9d6ab97d84d32311c7b167126c
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lakehouse-cdc-connect
      CONFIG_STORAGE_TOPIC: lakehouse_connect_configs
      OFFSET_STORAGE_TOPIC: lakehouse_connect_offsets
      STATUS_STORAGE_TOPIC: lakehouse_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      REST_ADVERTISED_HOST_NAME: debezium-connect
    ports:
      - "${KAFKA_CONNECT_HOST_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

  debezium-init:
    image: python:3.11-slim
    entrypoint: ["python", "/cdc/register_connector.py"]
    environment:
      KAFKA_CONNECT_URL: http://debezium-connect:8083
      CDC_CONNECTOR_NAME: core-banking-postgres-cdc
      CDC_CONNECTOR_CONFIG: /cdc/connectors/core-banking-postgres.json
      CDC_DB_USER: ${CDC_DB_USER:-debezium}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-debezium_local}
      CORE_BANKING_DB_NAME: ${CORE_BANKING_DB_NAME:-core_banking}
      CDC_TOPIC_PREFIX: ${CDC_TOPIC_PREFIX:-bank.core}
    volumes:
      - ./cdc:/cdc:ro
    depends_on:
      core-banking-source:
        condition: service_healthy
      debezium-connect:
        condition: service_healthy
    restart: "no"
    networks:
      - lakehouse

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakehouse

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lakehouse
        printf '' | mc pipe local/lakehouse/bronze/.keep
        printf '' | mc pipe local/lakehouse/silver/.keep
        printf '' | mc pipe local/lakehouse/gold/.keep
    networks:
      - lakehouse

  hive-metastore-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive_metastore_local}
      POSTGRES_DB: ${HIVE_METASTORE_DB_NAME:-metastore}
    volumes:
      - hive-metastore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lakehouse

  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive-metastore
    image: lakehouse-medallion-demo-hive-metastore:4.2.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-postgres:5432/${HIVE_METASTORE_DB_NAME:-metastore}
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_DB_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_DB_PASSWORD:-hive_metastore_local}
        -Dhive.metastore.warehouse.dir=/opt/hive/data/warehouse
        -Dmetastore.task.threads.always=org.apache.hadoop.hive.metastore.events.EventCleanerTask
    ports:
      - "${HIVE_METASTORE_HOST_PORT:-9083}:9083"
    volumes:
      - ./hive/conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
    depends_on:
      hive-metastore-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

  trino:
    image: trinodb/trino:482
    hostname: trino
    ports:
      - "${TRINO_HOST_PORT:-8082}:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    depends_on:
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse

  trino-init:
    image: python:3.11-slim
    entrypoint: ["python", "/trino/register_tables.py"]
    environment:
      TRINO_URL: http://trino:8080
      TRINO_USER: lakehouse-admin
      TRINO_CATALOG: lakehouse
    volumes:
      - ./trino:/trino:ro
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"
    networks:
      - lakehouse

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: lakehouse-medallion-demo-dbt:1.10.2
    environment:
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: "8080"
      DBT_TRINO_USER: dbt-local
      DBT_TRINO_CATALOG: lakehouse
      DBT_TRINO_SCHEMA: gold_dbt
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./dbt:/usr/app
    depends_on:
      trino:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - lakehouse

  bronze-cdc-writer:
    build:
      context: ./cdc/bronze
      dockerfile: Dockerfile
    image: lakehouse-medallion-demo-bronze-cdc-writer:1.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: ${BRONZE_CDC_CONSUMER_GROUP:-bronze-cdc-writer-v1}
      KAFKA_TOPIC_PATTERN: ${BRONZE_CDC_TOPIC_PATTERN:-^bank\.core\.(mms|MMS|krd|KRD|prm|PRM)\..+$$}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lakehouse
      S3_PREFIX: bronze/cdc
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SOURCE_SYSTEM: core_banking
      ALLOWED_SCHEMAS: mms,krd,prm
    depends_on:
      kafka:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - lakehouse

  spark-master:
    image: apache/spark:3.5.1-scala2.12-java17-python3-ubuntu
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./scripts:/opt/spark/scripts
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - lakehouse

  spark-worker:
    image: apache/spark:3.5.1-scala2.12-java17-python3-ubuntu
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"
    volumes:
      - ./scripts:/opt/spark/scripts
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lakehouse

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/dags /opt/airflow/scripts /opt/airflow/plugins
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Demo \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          --password admin || true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  core-banking-db-volume:
  kafka-data:
  minio-data:
  hive-metastore-postgres-data:
  trino-data:

networks:
  lakehouse:
    driver: bridge
